<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dispute Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --upi-purple: #5f259f;
        --upi-violet: #7c3aed;
        --upi-blue: #4f46e5;
        --upi-green: #10b981;
        --upi-orange: #ff6b35;
        --ink: #1e1b4b;
        --ink-light: #475569;
        --panel: #ffffff;
        --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --shadow-xl: 0 20px 50px rgba(79, 70, 229, 0.15);
        --shadow-lg: 0 10px 30px rgba(95, 37, 159, 0.12);
      }
      
      body {
        font-family: "Inter", sans-serif;
        color: var(--ink);
        background: 
          radial-gradient(circle at 15% 10%, rgba(124, 58, 237, 0.08), transparent 40%),
          radial-gradient(circle at 85% 80%, rgba(79, 70, 229, 0.06), transparent 50%),
          linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        min-height: 100vh;
      }
      
      h1, h2, h3, h4, h5 {
        font-family: "Poppins", sans-serif;
        font-weight: 700;
      }
      
      .navbar-dark {
        background: var(--bg-gradient) !important;
        box-shadow: 0 4px 20px rgba(95, 37, 159, 0.2);
      }
      
      .brand-mark {
        font-family: "Poppins", sans-serif;
        font-weight: 700;
        letter-spacing: -0.5px;
        font-size: 1.4rem;
        background: linear-gradient(120deg, #fff, #e0e7ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .nav-link {
        font-weight: 500;
        transition: all 0.3s ease;
        border-radius: 8px;
        margin: 0 4px;
      }
      
      .nav-link:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
      }
      
      .card-shadow {
        border: 0;
        box-shadow: var(--shadow-lg);
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      
      .card-shadow:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-xl);
      }
      
      .hero {
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(79, 70, 229, 0.08));
        border-radius: 24px;
        padding: 32px;
        margin-bottom: 32px;
        border: 1px solid rgba(124, 58, 237, 0.1);
        position: relative;
        overflow: hidden;
      }
      
      .hero::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -20%;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.15), transparent);
        border-radius: 50%;
        pointer-events: none;
      }
      
      .stat-pill {
        border-radius: 999px;
        padding: 6px 16px;
        font-weight: 600;
        font-size: 0.875rem;
        background: linear-gradient(135deg, var(--upi-purple), var(--upi-violet));
        color: white;
        box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      }
      
      .btn-primary {
        background: linear-gradient(135deg, var(--upi-purple), var(--upi-violet));
        border: none;
        font-weight: 600;
        padding: 10px 24px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
        transition: all 0.3s ease;
      }
      
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
      }
      
      .btn-outline-primary {
        border: 2px solid var(--upi-violet);
        color: var(--upi-violet);
        font-weight: 600;
        border-radius: 12px;
        transition: all 0.3s ease;
      }
      
      .btn-outline-primary:hover {
        background: var(--upi-violet);
        color: white;
        transform: translateY(-2px);
      }
      
      .badge {
        padding: 6px 12px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.8rem;
      }
      
      .text-bg-secondary {
        background: linear-gradient(135deg, #64748b, #475569) !important;
      }
      
      .timeline {
        border-left: 3px solid rgba(124, 58, 237, 0.2);
        margin-left: 12px;
        padding-left: 24px;
      }
      
      .timeline-item {
        position: relative;
        margin-bottom: 24px;
      }
      
      .timeline-item::before {
        content: "";
        position: absolute;
        left: -33px;
        top: 6px;
        width: 14px;
        height: 14px;
        background: linear-gradient(135deg, var(--upi-purple), var(--upi-violet));
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      }
      
      .fade-in {
        animation: fadeUp 0.6s ease both;
      }
      
      @keyframes fadeUp {
        from { 
          opacity: 0; 
          transform: translateY(20px); 
        }
        to { 
          opacity: 1; 
          transform: translateY(0); 
        }
      }
      
      pre {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: #e2e8f0;
        padding: 16px;
        border-radius: 12px;
        font-size: 0.85rem;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      
      .table {
        font-size: 0.95rem;
      }
      
      .table thead {
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.08), rgba(79, 70, 229, 0.08));
        color: var(--ink);
        font-weight: 600;
      }
      
      .table tbody tr {
        transition: background 0.2s ease;
      }
      
      .table tbody tr:hover {
        background: rgba(124, 58, 237, 0.04);
      }
      
      .form-control:focus, .form-select:focus {
        border-color: var(--upi-violet);
        box-shadow: 0 0 0 0.25rem rgba(124, 58, 237, 0.15);
      }
      
      footer {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(124, 58, 237, 0.1);
        margin-top: 60px;
      }
      
      .alert-success {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.08));
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: #065f46;
      }
      
      .alert-danger {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.08));
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand brand-mark" href="/dashboard">⚡ UPI Dispute Hub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/dashboard">📋 Disputes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard/raise">➕ Raise Dispute</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard/analytics">📊 Analytics</a>
            </li>
          </ul>
          <form class="d-flex" onsubmit="return false;">
            <input class="form-control form-control-sm me-2" id="apiKeyInput" type="password" placeholder="🔑 API Key" style="border-radius: 8px;">
            <button class="btn btn-sm btn-light" id="saveApiKey" type="button" style="border-radius: 8px; font-weight: 600;">Save</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="apiMessage" class="alert d-none" role="alert"></div>
      {% block content %}{% endblock %}
    </main>

    <footer class="container py-4 text-muted small">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div>
          <span style="font-weight: 600; color: var(--upi-purple);">⚡ UPI Dispute Hub</span>
          <span class="mx-2">•</span>
          <span>Powered by automated dispute resolution</span>
        </div>
        <div class="mt-2 mt-sm-0">
          <span style="font-family: 'Courier New', monospace; background: rgba(124, 58, 237, 0.08); padding: 4px 8px; border-radius: 6px;">
            🔗 {{ correlation_id[:16] }}...
          </span>
        </div>
      </div>
    </footer>

    <script>
      const apiKeyStorageKey = "dashboardApiKey";
      const apiKeyInput = document.getElementById("apiKeyInput");
      const saveApiKeyButton = document.getElementById("saveApiKey");
      const apiMessage = document.getElementById("apiMessage");

      function showMessage(text, type) {
        apiMessage.textContent = text;
        apiMessage.className = "alert alert-" + type;
        apiMessage.classList.remove("d-none");
      }

      function getApiKey() {
        return localStorage.getItem(apiKeyStorageKey) || "";
      }

      function saveApiKey() {
        const value = apiKeyInput.value.trim();
        if (value) {
          localStorage.setItem(apiKeyStorageKey, value);
          showMessage("API key saved for this browser.", "success");
        } else {
          localStorage.removeItem(apiKeyStorageKey);
          showMessage("API key cleared.", "warning");
        }
      }

      apiKeyInput.value = getApiKey();
      saveApiKeyButton.addEventListener("click", saveApiKey);

      function serializeFormToJson(form) {
        const data = new FormData(form);
        const payload = {};
        for (const [key, value] of data.entries()) {
          if (value !== "") {
            payload[key] = value;
          }
        }
        return payload;
      }

      async function submitApiForm(form) {
        const apiKey = getApiKey();
        if (!apiKey) {
          showMessage("Set an API key before submitting actions.", "warning");
          return;
        }

        const headers = {
          "X-API-Key": apiKey,
          "X-Timestamp": new Date().toISOString(),
        };

        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          headers["X-Nonce"] = window.crypto.randomUUID();
        }

        if (form.method && form.method.toUpperCase() !== "GET") {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            headers["Idempotency-Key"] = window.crypto.randomUUID();
          }
        }

        let body = null;

        if (form.dataset.json === "true") {
          headers["Content-Type"] = "application/json";
          body = JSON.stringify(serializeFormToJson(form));
        }

        try {
          const response = await fetch(form.action, {
            method: form.method.toUpperCase(),
            headers,
            body,
          });
          const payload = await response.json().catch(() => null);
          if (response.ok && payload && payload.success) {
            showMessage("Action completed.", "success");
            if (form.dataset.reload === "true") {
              window.location.reload();
            }
          } else {
            const message = payload && payload.error && payload.error.message
              ? payload.error.message
              : "Action failed.";
            showMessage(message, "danger");
          }
        } catch (error) {
          showMessage("Request failed.", "danger");
        }
      }

      document.querySelectorAll("form[data-api-post='true']").forEach((form) => {
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          submitApiForm(form);
        });
      });
    </script>
  </body>
</html>
